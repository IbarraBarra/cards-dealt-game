/* ------------------------------------------------------------------ */
/*  LOCAL IDENTITY (which room/player this browser is)                */
/* ------------------------------------------------------------------ */

function saveIdentity(roomCode, playerId, name) {
  localStorage.setItem("cardsDealt.identity", JSON.stringify({ roomCode, playerId, name }));
}
function loadIdentity() {
  try {
    const raw = localStorage.getItem("cardsDealt.identity");
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function clearIdentity() {
  localStorage.removeItem("cardsDealt.identity");
}

function randomCode() {
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  let out = "";
  for (let i = 0; i < 4; i++) out += letters[Math.floor(Math.random() * letters.length)];
  return out;
}

/*  APP                                                                */
/* ------------------------------------------------------------------ */

function App() {
  const [screen, setScreen] = useState("start"); // start | lobby | game
  const [nameInput, setNameInput] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const [room, setRoom] = useState(null);       // { code, phase, round, host_player_id }
  const [players, setPlayers] = useState([]);   // [{id, name}]
  const [votes, setVotes] = useState([]);       // [{player_id, suspect_id}]
  const [myPlayerId, setMyPlayerId] = useState(null);
  const [tab, setTab] = useState("case");

  const channelRef = useRef(null);

  // Restore identity on load (refresh-proof).
  useEffect(() => {
    const id = loadIdentity();
    if (id) {
      setMyPlayerId(id.playerId);
      setNameInput(id.name);
      joinExistingRoom(id.roomCode, id.playerId);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function subscribeToRoom(code) {
    if (channelRef.current) sb.removeChannel(channelRef.current);
    const channel = sb.channel(`room-${code}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "rooms", filter: `code=eq.${code}` },
        (payload) => { if (payload.eventType !== "DELETE") setRoom(payload.new); })
      .on("postgres_changes", { event: "*", schema: "public", table: "players", filter: `room_code=eq.${code}` },
        () => refreshPlayers(code))
      .on("postgres_changes", { event: "*", schema: "public", table: "votes", filter: `room_code=eq.${code}` },
        () => refreshVotes(code))
      .subscribe();
    channelRef.current = channel;
  }

  async function refreshPlayers(code) {
    const { data } = await sb.from("players").select("*").eq("room_code", code).order("created_at");
    if (data) setPlayers(data);
  }
  async function refreshVotes(code) {
    const { data } = await sb.from("votes").select("*").eq("room_code", code);
    if (data) setVotes(data);
  }

  async function joinExistingRoom(code, playerId) {
    setBusy(true);
    const { data: roomRow, error: roomErr } = await sb.from("rooms").select("*").eq("code", code).maybeSingle();
    if (roomErr || !roomRow) { setBusy(false); clearIdentity(); return; }
    setRoom(roomRow);
    await refreshPlayers(code);
    await refreshVotes(code);
    subscribeToRoom(code);
    setScreen(roomRow.phase === "lobby" ? "lobby" : "game");
    setBusy(false);
  }

  async function handleCreate() {
    setError(""); setBusy(true);
    const name = nameInput.trim() || "Detective";
    try {
      let code, insertErr;
      for (let attempts = 0; attempts < 5; attempts++) {
        code = randomCode();
        const res = await sb.from("rooms").insert({ code, phase: "lobby", round: 0 }).select().single();
        insertErr = res.error;
        if (!insertErr) break;
      }
      if (insertErr) throw insertErr;

      const { data: player, error: playerErr } = await sb
        .from("players").insert({ room_code: code, name }).select().single();
      if (playerErr) throw playerErr;

      await sb.from("rooms").update({ host_player_id: player.id }).eq("code", code);

      saveIdentity(code, player.id, name);
      setMyPlayerId(player.id);
      await joinExistingRoom(code, player.id);
    } catch (e) {
      setError(e.message || "Couldn't create a case. Check your Supabase setup.");
    } finally {
      setBusy(false);
    }
  }

  async function handleJoin() {
    setError(""); setBusy(true);
    const code = codeInput.trim().toUpperCase();
    const name = nameInput.trim() || "Detective";
    try {
      const { data: roomRow, error: roomErr } = await sb.from("rooms").select("*").eq("code", code).maybeSingle();
      if (roomErr || !roomRow) throw new Error("No case found with that code.");

      const { data: player, error: playerErr } = await sb
        .from("players").insert({ room_code: code, name }).select().single();
      if (playerErr) throw playerErr;

      saveIdentity(code, player.id, name);
      setMyPlayerId(player.id);
      await joinExistingRoom(code, player.id);
    } catch (e) {
      setError(e.message || "Couldn't join that case.");
    } finally {
      setBusy(false);
    }
  }

  async function handleAdvance() {
    if (!room) return;
    const phase = room.phase;
    if (phase === "lobby") {
      await sb.from("rooms").update({ phase: "briefing", round: 0 }).eq("code", room.code);
      setScreen("game"); setTab("case");
    } else if (phase === "briefing") {
      await sb.from("rooms").update({ phase: "investigation", round: 1 }).eq("code", room.code);
    } else if (phase === "investigation") {
      const nextRound = room.round + 1;
      if (nextRound > 5) {
        await sb.from("rooms").update({ phase: "voting" }).eq("code", room.code);
        setTab("vote");
      } else {
        await sb.from("rooms").update({ round: nextRound }).eq("code", room.code);
      }
    } else if (phase === "voting") {
      await sb.from("rooms").update({ phase: "reveal" }).eq("code", room.code);
    }
  }

  async function castVote(suspectId) {
    if (!myPlayerId || !room) return;
    await sb.from("votes").upsert({ player_id: myPlayerId, room_code: room.code, suspect_id: suspectId });
  }

  function leaveGame() {
    clearIdentity();
    if (channelRef.current) sb.removeChannel(channelRef.current);
    setRoom(null); setPlayers([]); setVotes([]); setMyPlayerId(null);
    setScreen("start"); setCodeInput(""); setError("");
  }

  if (screen === "start") {
    return (
      <div style={S.app}>
        <StartScreen
          nameInput={nameInput} setNameInput={setNameInput}
          codeInput={codeInput} setCodeInput={setCodeInput}
          onCreate={handleCreate} onJoin={handleJoin}
          error={error} busy={busy}
        />
      </div>
    );
  }

  if (screen === "lobby" && room) {
    const isHost = myPlayerId === room.host_player_id;
    return (
      <div style={S.app}>
        <LobbyScreen
          code={room.code} players={players} isHost={isHost}
          onStart={handleAdvance} busy={busy} onLeave={leaveGame}
        />
      </div>
    );
  }

  if (screen === "game" && room) {
    const isHost = myPlayerId === room.host_player_id;
    const myVote = votes.find((v) => v.player_id === myPlayerId)?.suspect_id || null;
    const voteCounts = {};
    votes.forEach((v) => { voteCounts[v.suspect_id] = (voteCounts[v.suspect_id] || 0) + 1; });

    return (
      <div style={S.app}>
        <GameScreen
          room={room} players={players} isHost={isHost}
          tab={tab} setTab={setTab}
          myVote={myVote} onVote={castVote}
          votesIn={votes.length} voteCounts={voteCounts} totalVotes={votes.length}
          onAdvance={handleAdvance} onLeave={leaveGame}
        />
      </div>
    );
  }

  return <div style={S.app}><div style={S.centerWrap}><p style={S.heroSub}>Loading…</p></div></div>;
}

          </button>
        </div>

        <div style={S.divider} />

        <p style={S.smallLabel}>Buddies Online ({players.length})</p>
        <ul style={S.playerList}>
          {players.map((p) => (
            <li key={p.id} style={S.playerRow}>
              <span style={S.playerDot} />
              <span style={{ color: COLORS.amber, fontWeight: 600 }}>{p.name}</span>
            </li>
          ))}
        </ul>

        {isHost ? (
          <>
            <div style={S.divider} />
            <button style={S.primaryBtn} onClick={onStart} disabled={busy}>
              Open the Case
            </button>
            <p style={S.footnote}>Any group size works — everyone investigates together on their own device.</p>
          </>
        ) : (
          <p style={S.footnote}>Waiting for the host to open the case…</p>
        )}
        <button style={{ ...S.secondaryBtn, marginTop: 10 }} onClick={onLeave}>Leave</button>

  );
}

function GameScreen({ room, players, isHost, tab, setTab, myVote, onVote, votesIn, voteCounts, totalVotes, onAdvance, onLeave }) {
  const phase = room.phase;
  const round = room.round;
  const revealed = EVIDENCE_LOG.filter((e) => e.round <= round);
  const revealedEvidence = revealed.filter((e) => e.kind === "evidence");
  const revealedDossierIds = new Set(revealed.filter((e) => e.kind === "dossier").map((e) => e.suspectId));

  return (
    <div style={S.gameWrap}>
      <div style={S.windowOuter}>
        <div style={S.titleBar}>
          <div style={S.titleBarLeft}>
            <span>Chat Room: Mosbius Designs — {phaseLabel(phase, round)}</span>
          </div>
          <div style={S.winBtnRow}>
            <div style={S.winBtn}>_</div>
            <div style={S.winBtn}>&#9633;</div>
            <div style={S.winBtn} onClick={onLeave} title="Leave the case">&times;</div>
          </div>
        </div>

        {isHost && phase !== "reveal" && (
          <div style={{ ...S.menuBar, justifyContent: "flex-end" }}>
            <button style={S.hostBtn} onClick={onAdvance}>
              {hostButtonLabel(phase)} &#9656;
            </button>
          </div>
        )}

        <div style={S.windowBody}>
          {phase === "briefing" && <BriefingPanel />}

          {phase === "investigation" && (
            <>
              <TabBar tab={tab} setTab={setTab} showVote={false} />
              {tab === "case" && <CasePanel round={round} />}
              {tab === "suspects" && <SuspectsPanel revealedDossierIds={revealedDossierIds} round={round} />}
              {tab === "evidence" && <EvidencePanel evidence={revealedEvidence} round={round} />}
            </>
          )}

          {phase === "voting" && (
            <>
              <TabBar tab={tab} setTab={setTab} showVote={true} />
              {tab === "case" && <CasePanel round={round} />}
              {tab === "suspects" && <SuspectsPanel revealedDossierIds={revealedDossierIds} round={round} />}
              {tab === "evidence" && <EvidencePanel evidence={revealedEvidence} round={round} />}
              {tab === "vote" && (
                <VotePanel myVote={myVote} onVote={onVote} votesIn={votesIn} total={players.length} round={round} />
              )}
            </>
          )}

          {phase === "reveal" && (
            <RevealPanel voteCounts={voteCounts} totalVotes={totalVotes} onLeave={onLeave} />
          )}
        </div>
      </div>
    </div>
  );
}

function TabBar({ tab, setTab, showVote }) {
  const tabs = [
    { id: "case", label: "Case" },
    { id: "suspects", label: "Suspects" },
    { id: "evidence", label: "Evidence" },
    ...(showVote ? [{ id: "vote", label: "Vote" }] : []),
  ];
  return (
    <div style={S.tabBar}>
      {tabs.map((t) => {
        const active = tab === t.id;
        return (
          <button key={t.id} onClick={() => setTab(t.id)} style={active ? S.tabActive : S.tab}>
            {t.label}
          </button>
        );
      })}
    </div>
  );
}

function CasePanel({ round }) {
  return (
    <div style={S.panel}>
      <div style={S.card}>
        <p style={S.smallLabel}>The victim</p>
        <h3 style={S.victimName}>{VICTIM.name}, {VICTIM.age}</h3>
        <p style={S.bodyText}>{VICTIM.bio}</p>
      </div>
      <div style={{ ...S.card, marginTop: 16 }}>
        <p style={S.smallLabel}>Where you are</p>
        <p style={S.bodyText}>
          Round {round} of 5 — {ROUND_LABELS[round - 1]}. Check the Evidence tab for what's
          been found, and the Suspects tab for what's been dug up on each of them. Discuss
          out loud, then move to Vote once the host opens the final round.
        </p>
      </div>
    </div>
  );
}

function SuspectsPanel({ revealedDossierIds, round }) {
  const visibleIds = SUSPECT_ORDER.filter((id) => SUSPECTS[id].revealRound <= round);
  return (
    <div style={S.panel}>
      <div style={S.card}>
        <p style={S.smallLabel}>{visibleIds.length} of {SUSPECT_ORDER.length} suspects identified so far</p>
        {visibleIds.map((id) => {
          const s = SUSPECTS[id];
          const unlocked = revealedDossierIds.has(id);
          return (
            <div key={id} style={S.castRow}>
              <p style={S.castName}>{s.name}</p>
              <p style={S.castOcc}>{s.occupation}, {s.age}</p>
              <p style={S.castBio}>{s.publicBio}</p>
              <p style={S.statementText}>{s.statement}</p>
              {unlocked && (
                <div style={S.dossierBox}>
                  <p style={S.dossierLabel}>Investigation notes</p>
                  <p style={S.bodyText}>{s.dossier}</p>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function EvidencePanel({ evidence, round }) {
  return (
    <div style={S.panel}>
      <div style={S.card}>
        <p style={S.smallLabel}>Evidence log — round {round} of 5</p>
        {evidence.length === 0 && <p style={S.bodyText}>None yet. The host will reveal the first findings shortly.</p>}
        {[1, 2, 3, 4, 5].map((r) => {
          const roundEvidence = evidence.filter((e) => e.round === r);
          if (roundEvidence.length === 0) return null;
          return (
            <div key={r} style={{ marginTop: 14 }}>
              <p style={S.roundHeading}>{ROUND_LABELS[r - 1]}</p>
              {roundEvidence.map((e) => (
                <div key={e.id} style={S.clueRow}>
                  <span style={S.clueDot} />
                  <p style={S.bodyText}>{e.text}</p>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function VotePanel({ myVote, onVote, votesIn, total, round }) {
  const visibleIds = SUSPECT_ORDER.filter((id) => SUSPECTS[id].revealRound <= round);
  return (
    <div style={S.panel}>
      <div style={S.card}>
        <p style={S.smallLabel}>Who hacked Juliana Dowdy?</p>
        <p style={S.footnote}>{votesIn} of {total} detectives have voted.</p>
        <div style={{ marginTop: 10 }}>
          {visibleIds.map((id) => {
            const s = SUSPECTS[id];
            const selected = myVote === id;
            return (
              <button key={id} onClick={() => onVote(id)} style={selected ? S.suspectBtnActive : S.suspectBtn}>
                {s.name}
              </button>
            );
          })}
        </div>
        {myVote && <p style={S.footnote}>Your vote: {SUSPECTS[myVote].name}. You can change it any time before the reveal.</p>}
      </div>
    </div>
  );
}

function RevealPanel({ voteCounts, totalVotes, onLeave }) {
  const killer = SUSPECTS[HACKER_ID];
  const sortedVotes = Object.entries(voteCounts).sort((a, b) => b[1] - a[1]);

  return (
    <div style={S.panel}>
      <div style={{ ...S.card, ...S.revealCard }}>
        <p style={S.smallLabelWine}>The verdict</p>
        <h3 style={S.revealName}>{killer.name}</h3>
        <div style={S.solutionText}>
          {SOLUTION.split("\n\n").map((p, i) => <p key={i} style={S.bodyTextLg}>{p}</p>)}
        </div>
      </div>

      <div style={{ ...S.card, marginTop: 16 }}>
        <p style={S.smallLabel}>How the room voted ({totalVotes} votes)</p>
        {sortedVotes.length === 0 && <p style={S.bodyText}>No votes were cast.</p>}
        {sortedVotes.map(([id, count]) => (
          <div key={id} style={S.voteResultRow}>
            <span style={{ ...S.bodyText, color: id === HACKER_ID ? COLORS.sage : COLORS.parchment }}>
              {SUSPECTS[id].name} {id === HACKER_ID && "— correct"}
            </span>
            <span style={S.voteCount}>{count}</span>
          </div>
        ))}
      </div>

      <button style={{ ...S.secondaryBtn, marginTop: 16 }} onClick={onLeave}>
        Leave This Case
      </button>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  LABEL HELPERS                                                      */
/* ------------------------------------------------------------------ */

function phaseLabel(phase, round) {
  if (phase === "lobby") return "Lobby";
  if (phase === "briefing") return "Briefing";
  if (phase === "investigation") return `Investigation — ${ROUND_LABELS[round - 1] || ""}`;
  if (phase === "voting") return "Final Accusation";
  if (phase === "reveal") return "The Truth";
  return "";
}

function hostButtonLabel(phase) {
  if (phase === "lobby") return "Open the case";
  if (phase === "briefing") return "Begin investigation";
  if (phase === "investigation") return "Next round";
  if (phase === "voting") return "Reveal the hacker";
  return "Continue";
}
